name: Build Windows exe

on:
  workflow_dispatch:        # запуск вручную: вкладка Actions -> Run workflow
  push:
    tags: ["v*"]            # или при создании тега v1.0.0 и т.п.

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Если версии Qt-пакетов не совпадают или QtWebEngine не грузится — сборка остановится здесь,
      # а не выдаст exe с нерабочей картой.
      - name: Проверка Qt и QtWebEngine
        run: python tools/check_webengine.py

      - name: Сборка exe
        run: pyinstaller --noconfirm --onefile --windowed --name NTE_Wish_Tracker main.py

      - name: Подготовка папки релиза
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\NTE_Wish_Tracker.exe release\
          foreach ($d in "assets", "icons") {
            if (Test-Path $d) { Copy-Item -Recurse $d "release\$d" }
          }
          Copy-Item README.md release\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release
